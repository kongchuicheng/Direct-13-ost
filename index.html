<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>在线音频播放器</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d1117;
      color: #e6edf3;
    }
    main {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid #30363d;
      border-radius: 20px;
      background: #161b22;
      box-shadow: 0 16px 48px #0005;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #8b949e;
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { color: #b1bac4; line-height: 1.6; }
    audio { display: block; width: 100%; margin: 24px 0 14px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a {
      display: inline-block;
      color: #58a6ff;
      text-decoration: none;
      padding: 9px 12px;
      border: 1px solid #30363d;
      border-radius: 10px;
    }
    a:hover { background: #21262d; }
    .hint { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Direct13 · Audio</p>
    <h1>在线音频播放器</h1>
    <p>点击下方播放按钮即可收听音频。你也可以拖动进度条或调整音量。</p>

    <audio controls preload="metadata">
      <source src="https://github.com/kongchuicheng/Direct13/raw/refs/heads/main/1.mp3" type="audio/mpeg">
      您的浏览器不支持 HTML 音频播放。
    </audio>

    <p class="hint">如果播放器无法加载，请尝试直接打开音频文件。</p>
    <div class="links">
      <a href="https://github.com/kongchuicheng/Direct13/raw/refs/heads/main/1.mp3" target="_blank" rel="noopener noreferrer">打开原始音频</a>
      <a href="https://github.com/kongchuicheng/Direct13" target="_blank" rel="noopener noreferrer">查看 GitHub 仓库</a>
    </div>
  </main>
</body>
</html>
